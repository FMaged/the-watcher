# The stack of C-21: one Rust binary, PostgreSQL, and a reverse proxy that terminates TLS and
# serves the frontend build. Frontend and API share one origin, so there is no cross-origin
# configuration to get wrong and no credential in client-side JavaScript.
#
# Run from this directory: docker compose up -d
name: the-watcher

services:
  postgres:
    image: postgres:16.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: the_watcher
      POSTGRES_USER: watcher_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Read by initdb/10-roles.sh, which is the only place the application role's password
      # is set. Migration 0001 grants it privileges but never knows the secret.
      WATCHER_APP_PASSWORD: ${WATCHER_APP_PASSWORD:?set WATCHER_APP_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts here run once, on first initialisation of an empty data directory. They do
      # NOT run again on a later start, so changing them means recreating the volume.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watcher_owner -d the_watcher"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Not published. Nothing outside this network needs to reach the database.

  watcher:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./.env
    depends_on:
      postgres:
        # service_started would let the binary come up before the database accepts
        # connections, which on a restart loop looks like a configuration fault.
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Not published either. Caddy is the only way in, which is what keeps C-22's basic auth
    # from being bypassable by hitting the API directly.

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - watcher
    ports:
      - "80:80"
      - "443:443"
    environment:
      WATCHER_DOMAIN: ${WATCHER_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend:/srv/frontend:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  # Populated by the frontend build in T3.8. Empty until then.
  frontend:
  # Caddy keeps its issued certificates here. Losing this volume means re-issuing them.
  caddydata:
  caddyconfig:
