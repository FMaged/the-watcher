[package]
name = "watcher-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["net", "signal"] }
watcher-core = { path = "../watcher-core" }
watcher-store = { path = "../watcher-store" }
watcher-ledger = { path = "../watcher-ledger" }
watcher-agent = { path = "../watcher-agent" }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
