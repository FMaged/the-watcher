[package]
name = "watcher-feeds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["time", "macros"] }
watcher-core = { path = "../watcher-core" }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }
